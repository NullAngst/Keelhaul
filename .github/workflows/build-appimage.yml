name: Build AppImage

# Builds Keelhaul-x86_64.AppImage and attaches it to the GitHub release
# whenever a tag is pushed. Run it by hand from the Actions tab to get the
# AppImage as a workflow artifact without making a release.

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          # PyQt6 wheels link against the host's GL and EGL libraries instead of
          # bundling them. Every desktop has these, a bare runner does not, and
          # the smoke test below cannot import QtGui without them. Same list the
          # CI workflow installs.
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip python-appimage

      # No pinned Python: use the newest base image python-appimage publishes.
      # This step also downloads that base image, so python-appimage never
      # queries the GitHub API itself. Its own lookup is unauthenticated with
      # no retry, and one 504 from api.github.com killed the whole build.
      - name: Pick and download the newest Python base image
        id: py
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o build/releases.json \
            "https://api.github.com/repos/niess/python-appimage/releases?per_page=100"
          python3 - build/releases.json >build/pick.env <<'PY'
          import json, re, sys
          releases = json.load(open(sys.argv[1]))
          best = None
          for r in releases:
              m = re.fullmatch(r"python(\d+)\.(\d+)", r["tag_name"])
              if m and (best is None or tuple(map(int, m.groups())) > best[0]):
                  best = (tuple(map(int, m.groups())), r)
          if best is None:
              sys.exit("no pythonX.Y release found")
          (major, minor), rel = best
          tag = "cp%d%d" % (major, minor)
          # Same choice python-appimage makes: plain cpXY-cpXY (not the free
          # threaded build), lowest numbered manylinux tag for x86_64.
          pat = re.compile(r"python(\d+\.\d+\.\d+)-%s-%s-manylinux(\d+)_x86_64\.AppImage" % (tag, tag))
          hits = [(m.group(2), m.group(1), a) for a in rel["assets"] if (m := pat.fullmatch(a["name"]))]
          if not hits:
              sys.exit("no %s-%s manylinux x86_64 image in %s" % (tag, tag, rel["tag_name"]))
          _, full, asset = min(hits, key=lambda h: h[0])
          print("version=%d.%d" % (major, minor))
          print("full=%s" % full)
          print("name=%s" % asset["name"])
          print("url=%s" % asset["browser_download_url"])
          PY
          . build/pick.env
          echo "Using Python $full from $name"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "build/$name" "$url"
          chmod +x "build/$name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$GITHUB_WORKSPACE/build/$name" >> "$GITHUB_OUTPUT"

      - name: Stage the recipe
        run: |
          cp -r packaging/appimage build/keelhaul-recipe
          cp -r keelhaul build/keelhaul
          find build/keelhaul -name __pycache__ -prune -exec rm -rf {} +
          # Web UI uploads drop the executable bit, so set it here instead of
          # trusting the repo's file modes.
          chmod +x build/keelhaul-recipe/entrypoint.sh

      # python-appimage assembles the AppDir in a private 0700 temp dir, and
      # current appimagetool refuses to package anything other users cannot
      # read. So stop python-appimage before packaging, fix the modes, and
      # package with appimagetool ourselves.
      - name: Build the AppDir
        working-directory: build
        run: |
          python-appimage build app --no-packaging -b "${{ steps.py.outputs.image }}" keelhaul-recipe -x keelhaul
          test -d Keelhaul-x86_64 || { echo "AppDir Keelhaul-x86_64 was not created" >&2; exit 1; }

      - name: Fix AppDir permissions
        working-directory: build
        run: |
          chmod -R a+rX Keelhaul-x86_64
          chmod a+rx Keelhaul-x86_64/AppRun
          chmod a+rx Keelhaul-x86_64/usr/bin/*

      - name: Package with appimagetool
        working-directory: build
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --no-appstream Keelhaul-x86_64 Keelhaul-x86_64.AppImage

      - name: Smoke test the AppImage
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x Keelhaul-x86_64.AppImage
          ./Keelhaul-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun || { echo "AppRun is not executable" >&2; exit 1; }
          chmod +x squashfs-root/usr/bin/python*
          # -P keeps the current directory off sys.path. Without it, Python finds
          # the staged build/keelhaul next to us first and tests that copy
          # instead of the one inside the AppImage.
          PYTHONPATH=squashfs-root timeout 120 ./squashfs-root/usr/bin/python${{ steps.py.outputs.version }} -P -c \
            'import keelhaul.ui.mainwindow, keelhaul.core.escalation; print("imports ok")'

      - uses: actions/upload-artifact@v4
        with:
          name: Keelhaul-x86_64.AppImage
          path: build/Keelhaul-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Keelhaul-x86_64.AppImage
          generate_release_notes: true
