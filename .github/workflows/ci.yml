name: CI

# Lint, import smoke test and the unit tests on every push and pull request,
# so nothing broken merges.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Nothing here should take more than a few minutes. A hung GUI gets killed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y age gnupg cryptsetup-bin libimage-exiftool-perl \
            libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 300 python - <<'EOF'
          import pkgutil, importlib, keelhaul
          # __main__ launches the app and blocks in its event loop.
          # root_helper runs as a script under pkexec and is never imported.
          SKIP = ("keelhaul.__main__", "keelhaul.core.root_helper")
          for m in pkgutil.walk_packages(keelhaul.__path__, "keelhaul."):
              if m.name in SKIP:
                  continue
              importlib.import_module(m.name)
              print("imported", m.name, flush=True)
          from PyQt6.QtWidgets import QApplication
          from keelhaul.core import tools
          from keelhaul.core.secrets import harden_process
          from keelhaul.core.settings import Settings
          from keelhaul.ui.base import AppContext
          from keelhaul.ui.mainwindow import MainWindow
          from keelhaul.watchdog.monitor import Watchdog
          app = QApplication([])
          ctx = AppContext(tools.probe(), Settings(), Watchdog({}), {}, harden_process())
          MainWindow(ctx)
          print("imports and window ok", flush=True)
          EOF

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 600 python -m pytest -q tests
